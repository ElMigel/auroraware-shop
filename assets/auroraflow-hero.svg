<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img"
     aria-label="Illustration eines Kanban-Boards mit drei Spalten und Karten">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0f1a2e"/>
            <stop offset="1" stop-color="#101f38"/>
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="900" height="560" rx="26" fill="url(#bg)"/>
    <rect x="40" y="70" width="820" height="440" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="60" y="55" fill="#eef2ff" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="26" font-weight="800">AuroraFlow</text>
    <text x="60" y="86" fill="#c7d2fe" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="16">Workflow &amp; Projektübersicht</text>

    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial">
        <g>
            <rect x="70" y="110" width="240" height="380" rx="18" fill="rgba(125,211,252,0.10)" stroke="rgba(125,211,252,0.25)"/>
            <text x="90" y="150" fill="#eef2ff" font-size="18" font-weight="800">Backlog</text>
            <rect x="90" y="170" width="200" height="70" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
            <text x="105" y="200" fill="#eef2ff" font-size="14" font-weight="700">Kund:innenbriefing</text>
            <text x="105" y="222" fill="#c7d2fe" font-size="12">PDF-Export vorbereiten</text>

            <rect x="90" y="255" width="200" height="70" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
            <text x="105" y="285" fill="#eef2ff" font-size="14" font-weight="700">Roadmap Q1</text>
            <text x="105" y="307" fill="#c7d2fe" font-size="12">Meilensteine definieren</text>
        </g>

        <g>
            <rect x="330" y="110" width="240" height="380" rx="18" fill="rgba(52,211,153,0.10)" stroke="rgba(52,211,153,0.25)"/>
            <text x="350" y="150" fill="#eef2ff" font-size="18" font-weight="800">In Arbeit</text>
            <rect x="350" y="170" width="200" height="70" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
            <text x="365" y="200" fill="#eef2ff" font-size="14" font-weight="700">Zeiterfassung</text>
            <text x="365" y="222" fill="#c7d2fe" font-size="12">Barrierefreie Formulare</text>

            <rect x="350" y="255" width="200" height="70" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
            <text x="365" y="285" fill="#eef2ff" font-size="14" font-weight="700">Freigaben</text>
            <text x="365" y="307" fill="#c7d2fe" font-size="12">Kommentare &amp; Versionen</text>
        </g>

        <g>
            <rect x="590" y="110" width="240" height="380" rx="18" fill="rgba(251,113,133,0.10)" stroke="rgba(251,113,133,0.25)"/>
            <text x="610" y="150" fill="#eef2ff" font-size="18" font-weight="800">Erledigt</text>
            <rect x="610" y="170" width="200" height="70" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
            <text x="625" y="200" fill="#eef2ff" font-size="14" font-weight="700">Onboarding</text>
            <text x="625" y="222" fill="#c7d2fe" font-size="12">Tutorial &amp; Tastaturhilfe</text>
        </g>
    </g>
</svg>
